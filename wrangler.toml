name = "vibedeployer"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# SESSION_SECRET and GOOGLE_CLIENT_SECRET are secrets in prod
# (`wrangler secret put ...`) and come from .dev.vars locally.

[vars]
# Cloudflare Web Analytics beacon token (dash → Analytics & Logs → Web Analytics
# → Add a site, hostname vibedeployer.sebous.workers.dev). Empty = disabled.
CF_BEACON_TOKEN = "e31d69e5daf44443bbd89f11551cd649"
# Google OAuth client (Web application) with redirect URI
# https://vibedeployer.sebous.workers.dev/auth/google/callback
GOOGLE_CLIENT_ID = ""
# ADMIN_EMAILS: comma-separated emails that can open /admin (must sign in
# with Google). Set as a secret so emails stay out of the repo.

[[d1_databases]]
binding = "DB"
database_name = "vibedeployer-db"
# Fill this in after `wrangler d1 create vibedeployer-db`
database_id = "58ca5754-aa56-4afd-a2ca-ec8e80a2ff49"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "vibedeployer-docs"
